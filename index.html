{name:"Hypatie",y:"355-415",t:"philosophe assassinée",b:"Elle enseignait la géométrie dans les rues d'Alexandrie. Le patriarche Cyrille la fit déchiqueter par une foule de chrétiens fanatiques. Ses restes furent brûlés.",o:"Ce nombre est une femme dans une ville d'hommes. Il éclaire, et on le tue pour ça."},
{name:"Évariste Galois",y:"1811-1832",t:"duel nocturne",b:"La nuit avant le duel, il écrivit 60 pages de mathématiques en marge, en hâte, en sang. Il avait 20 ans. Son adversaire était un officier royaliste. Le matin, il mourut d'un coup de pistolet au ventre.",o:"Ce nombre est jeune, trop jeune. Il porte une lettre qu'il n'aura pas le temps d'envoyer."},
{name:"Sophie Germain",y:"1776-1831",t:"masque masculin",b:"Elle signait ses lettres à Gauss sous le nom de « Monsieur Le Blanc » pour que ses théorèmes soient lus. Elle mourut sans jamais avoir été admise à l'Université.",o:"Ce nombre porte un masque masculin. Sous le masque, une armure faite de silence."},
{name:"Srinivasa Ramanujan",y:"1887-1920",t:"rêves divins",b:"Il crut que les formules lui étaient dictées par la déesse Namagiri dans ses rêves. Il mourut à 32 ans, de malnutrition. Son taxi préféré était le 1729.",o:"Ce nombre rêve. Il entend des voix que les autres n'entendent pas."},

{name:"Ada Lovelace",y:"1815-1852",t:"poésie calculante",b:"Fille de Lord Byron, elle traduisit Babbage, ajouta la Note G — le premier algorithme conçu pour une machine. Elle fumait de l'opium et rêvait d'ordinateurs musiciens.",o:"Ce nombre est le fils d'un poète. Il calcule, mais il rêve en vers."},
{name:"Émilie du Châtelet",y:"1706-1749",t:"traduction en urgence",b:"Elle traduisit Newton en français pendant qu'elle était enceinte de son troisième enfant. Elle accoucha et mourut dans la semaine. Voltaire : « Elle était un grand homme. »",o:"Ce nombre traduit l'univers en urgence. Il sait que le temps est compté."},
{name:"Alan Turing",y:"1912-1954",t:"pomme empoisonnée",b:"Il déchiffra Enigma, sauva des millions de vies. Le gouvernement le castra chimiquement pour homosexualité. Il trouva la mort avec une pomme empoisonnée au cyanure. Apple niera toujours le lien.",o:"Ce nombre mord la pomme. Le savoir, c'est le poison."},
{name:"Grigori Perelman",y:"1966-",t:"ermite",b:"Il résolut la Conjecture de Poincaré, posta la preuve sur arXiv, refusa la médaille Fields, refusa le million de dollars. Il vit avec sa mère à Saint-Pétersbourg dans un appartement délabré.",o:"Ce nombre n'a pas besoin de prix. Il a déjà gagné contre le monde."},
{name:"Maryam Mirzakhani",y:"1977-2017",t:"surfaces et napkins",b:"Première femme médaille Fields (2014). Iranienne. Elle mourut à 40 ans d'un cancer. Ses filles trouvaient des formules géométriques sur les napkins de la cuisine.",o:"Ce nombre dessine sur les napkins de la vie. Le cancer ne gagne pas la beauté."},
{name:"Pierre de Fermat",y:"1607-1665",t:"marge trop étroite",b:"Juge de paix à Toulouse. « J'ai découvert une merveilleuse démonstration, mais cette marge est trop étroite. » Il mourut sans révéler la preuve. Wiles a mis 358 ans à la retrouver.",o:"Ce nombre a une preuve qu'il ne montrera jamais. Le secret est plus fort que la vérité."},

{name:"Sofia Kovalevskaya",y:"1850-1891",t:"mari blanc",b:"Elle dut contracter un mari blanc pour quitter la Russie. Première femme professeure d'Europe. Elle mourut en rentrant d'un voyage. Son dernier mot : « Trop de bonheur. »",o:"Ce nombre voyage avec un faux mari. Le faux mari ouvre la vraie porte."},
{name:"John Nash",y:"1928-2015",t:"délires et Nobel",b:"Il voyait des agents partout. Prix Nobel d'Économie en 1994 pour un article de 27 pages à 21 ans. Il se rétablit sans médicaments. Il mourut avec sa femme dans un accident de taxi.",o:"Ce nombre voit des conspirations. Parfois, les conspirations sont réelles."},
{name:"Paul Erdős",y:"1913-1996",t:"sans domicile fixe",b:"Pas de maison, pas de voiture, pas de travail fixe. Il voyageait avec une valise d'amphétamines et de papiers. Il mourut à un congrès, en pleine résolution d'un problème.",o:"Ce nombre n'a pas de domicile. Il est chez lui partout où il y a une équation."},
{name:"Henri Poincaré",y:"1854-1912",t:"chute d'une chaise",b:"Il tomba d'une chaise à 5 ans et devint amblyope. On le crut idiot. Il inventa la topologie et posa les bases de la relativité. Il écrivait 500 pages par an.",o:"Ce nombre tombe d'une chaise. La chute lui donne des ailes."},
{name:"Emmy Noether",y:"1882-1935",t:"symétrie exilée",b:"Elle prouva que la conservation de l'énergie découle de la symétrie temporelle. Hitler chassa les juifs ; elle partit aux USA. Elle mourut d'une opération banale. Einstein écrivit son éloge.",o:"Ce nombre est une symétrie cachée. On le chasse, il conserve l'énergie ailleurs."},
{name:"Alexander Grothendieck",y:"1928-2014",t:"brûleur de manuscrits",b:"Il réécriva la géométrie algébrique. Il disparut dans les Pyrénées, vivant de lait et de racines. Il brûla 30 000 pages de manuscrits. Il croyait que le diable s'infiltrait via la bombe atomique.",o:"Ce nombre brûle ses propres manuscrits. Il sait que certaines vérités doivent disparaître."},

{name:"Maria Gaetana Agnesi",y:"1718-1799",t:"sorcière enfermée",b:"Elle parlait 7 langues à 11 ans. Elle traduisit Newton et inventa la courbe de la sorcière. Elle renonça aux maths, entra au couvent, et mourut oubliée.",o:"Ce nombre est une sorcière. On l'oblige à parler, puis on l'enferme."},
{name:"Euclide",y:"vers -300",t:"trois oboles",b:"« Que gagnerai-je à apprendre la géométrie ? » — « Donne-lui trois oboles. » Il n'a jamais eu de roi. Il a eu des axiomes.",o:"Ce nombre n'a pas de roi. Il a des axiomes, et ça suffit."},
{name:"Archimède",y:"vers -287--212",t:"cercles dans le sable",b:"Un soldat romain entra chez lui à Syracuse. Archimède dessinait des cercles dans le sable : « Ne trouble pas mes cercles. » Le soldat le tua.",o:"Ce nombre dessine dans le sable. Le soldat ne comprend pas."},
{name:"Blaise Pascal",y:"1623-1662",t:"vision cousue",b:"Machine à calculer à 19 ans, probabilités avec Fermat, géométrie projective. Vision mystique en 1654. Il cacha le papier dans sa doublure jusqu'à sa mort.",o:"Ce nombre a eu une vision dans la nuit. Il a cousu la vision dans sa veste."},
{name:"Fibonacci",y:"vers 1170-1250",t:"couple de lapins",b:"Il ramena le zéro en Europe. Problème des lapins : un couple dans un lieu clos. L'Europe ne s'en est jamais remise.",o:"Ce nombre est un couple de lapins. Il se multiplie dans le silence."},
{name:"Niccolò Tartaglia",y:"1499-1557",t:"crâne fendu",b:"On lui fendit le crâne d'un coup de sabre. Il bégaya toute sa vie. Cardan lui vola la formule du troisième degré. Il mourut dans la pauvreté.",o:"Ce nombre a le crâne fendu. On lui vole la formule, il garde la cicatrice."},
{name:"Niels Henrik Abel",y:"1802-1829",t:"deux jours trop tôt",b:"Il prouva l'impossibilité de résoudre le cinquième degré. Cauchy égarla son manuscrit. Il mourut à 26 ans, deux jours avant une lettre lui offrant un poste à Berlin.",o:"Ce nombre meurt deux jours trop tôt. La lettre arrive après."},
{name:"Julia Robinson",y:"1919-1985",t:"vomisseur de vérité",b:"Elle résolut le 10ème problème de Hilbert après 20 ans de travail solitaire. Elle vomissait avant les conférences. Elle refusa d'être photographiée.",o:"Ce nombre vomit avant de parler. Il a raison d'avoir peur."},
{name:"Yitang Zhang",y:"1955-",t:"sandwichs et primes",b:"Inconnu jusqu'à 50 ans, il travaillait dans un Subway. En 2013, il prouva qu'il existe une infinité de paires de premiers séparés par au plus 70 millions.",o:"Ce nombre fait des sandwichs jusqu'à 50 ans. Puis il change le monde."},
{name:"G.H. Hardy",y:"1877-1947",t:"inutilité fière",b:"Il détestait les applications pratiques. Il adorait le cricket. Il mourut en essayant de se suicider par overdose de barbituriques.",o:"Ce nombre est inutile. C'est son plus grand orgueil."},
{name:"Marjorie Rice",y:"1923-2017",t:"mère au foyer pavage",b:"Mère de cinq enfants, sans diplôme. À 50 ans, elle découvrit de nouveaux pavages pentagonaux. Les pros furent humiliés et fascinés.",o:"Ce nombre est une mère au foyer. Elle pavage l'infini entre deux lessives."},
{name:"Diophante",y:"vers 200-284",t:"tombeau calculé",b:"Le père de l'algèbre. Son tombeau porte une énigme sur les fractions de sa vie. Il mourut sans savoir qu'on le résoudrait pendant 1 700 ans.",o:"Ce nombre est une énigme gravée sur une pierre. On le résout après sa mort."},
{name:"Al-Khwarizmi",y:"vers 780-850",t:"père de l'algorithme",b:"Son nom donna « algorithme ». Il importa les chiffres arabes en Occident. Il mourut sans savoir qu'il avait nommé le monde numérique.",o:"Ce nombre est un mot. Le mot devient le monde."},
{name:"Omar Khayyam",y:"1048-1131",t:"poète et calendrier",b:"Il réforma le calendrier perse avec une précision de un jour sur 5 000 ans. L'Occident ne retint que ses vers sur le vin et la rose.",o:"Ce nombre calcule le temps. Le temps boit du vin et oublie."},
{name:"Liu Hui",y:"vers 220-280",t:"polygones de pi",b:"Il calcula π avec des polygones de 3 072 côtés. Il refusa de devenir fonctionnaire impérial. Ses méthodes survécurent aux dynasties.",o:"Ce nombre dessine des polygones dans un cercle. Le cercle reste parfait."},
{name:"Brahmagupta",y:"598-668",t:"règles du zéro",b:"Il établit les règles du zéro. Il calcula la racine carrée de nombres négatifs. Il mourut en regardant les étoiles qu'il avait calculées.",o:"Ce nombre divise le néant par le néant. Il trouve quelque chose."},
{name:"Bhaskara II",y:"1114-1185",t:"fils astronome",b:"Il dirigea l'observatoire d'Ujjain. Il nomma sa fille Lilavati et lui dédia un livre de maths sous forme de poèmes d'amour.",o:"Ce nombre dédie un livre à sa fille. Les équations sont des poèmes."},
{name:"Madhava de Sangamagrama",y:"vers 1340-1425",t:"série du Kerala",b:"Il inventa le calcul infinitésimal 200 ans avant Newton. L'Europe ne sut jamais qu'elle avait été devancée.",o:"Ce nombre est un moine. Il calcule π dans un temple oublié."},
{name:"Jacques Bernoulli",y:"1654-1705",t:"tombe en spirale",b:"Il demanda une spirale logarithmique sur sa tombe : « Même changé, je renais le même. » On dessina une spirale d'Archimède à la place.",o:"Ce nombre renaît identique. On lui donne la mauvaise tombe."},
{name:"Jean Bernoulli",y:"1667-1748",t:"vendeur d'âme",b:"Il résolut la brachistochrone en une nuit. Il vendit son âme à Leibniz. Il se battit avec son fils pour le prix de l'Académie.",o:"Ce nombre vend son âme pour une équation. L'équation est meilleure marché."},
{name:"Leonhard Euler",y:"1707-1783",t:"aveugle et prolixe",b:"Il perdit la vue à 28 ans puis à 59 ans. 800 livres, 13 enfants. Il mourut en calculant l'orbite d'Uranus.",o:"Ce nombre est aveugle. Il voit mieux que ceux qui ont des yeux."},
{name:"Joseph-Louis Lagrange",y:"1736-1813",t:"Mécanique Analytique",b:"Né pauvre à Turin. Il écrivit la Mécanique Analytique sans aucun dessin. Napoléon le fit comte. Il mourut seul, mais honoré.",o:"Ce nombre écrit sans dessiner. Les mots suffisent à mouvoir le monde."},
{name:"Pierre-Simon Laplace",y:"1749-1827",t:"hypothèse inutile",b:"« Où est Dieu ? » — « Sire, je n'ai pas besoin de cette hypothèse. » Il mourut le jour de sa transformation en marquis.",o:"Ce nombre n'a pas besoin de Dieu. Il a des probabilités."},

{name:"Augustin-Louis Cauchy",y:"1789-1857",t:"7000 pages",b:"Royaliste fanatique. 7000 pages, analyse rigoureuse, étudiants terrorisés. Il mourut seul, victime de son intransigeance.",o:"Ce nombre est rigoureux. La rigueur tue les amis."},
{name:"Siméon Denis Poisson",y:"1781-1840",t:"loi des hasards",b:"Trop maladroit pour la chirurgie, il devint mathématicien. Loi des événements rares. Il mourut en disant : « La vie est bonne pour très peu de chose. »",o:"Ce nombre compte les événements rares. Les rares finissent par arriver."},
{name:"Peter Lejeune Dirichlet",y:"1805-1859",t:"mendelssohn",b:"Il épousa Rebecka Mendelssohn. Il prouva une infinité de premiers en progression arithmétique. Ses notes furent brûlées par sa femme.",o:"Ce nombre épouse la musique. La musique brûle ses notes."},

{name:"Richard Dedekind",y:"1831-1916",t:"coupure de saucisse",b:"Il eut l'idée de la coupure en regardant un cours. Il coupa mentalement une saucisse à l'infini. Il mourut après avoir fêté son anniversaire.",o:"Ce nombre coupe une saucisse à l'infini. La saucisse devient réelle."},
{name:"Leopold Kronecker",y:"1823-1891",t:"persécuteur de Cantor",b:"« Dieu a créé les entiers. » Il traqua Cantor jusqu'à la folie. Riche banquier devenu mathématicien. Son tombeau est modeste.",o:"Ce nombre persécute l'infini. L'infini se venge dans les hôpitaux."},
{name:"James Sylvester",y:"1814-1897",t:"juif exclu",b:"Exclu d'Oxford et Cambridge. Il inventa le mot « matrice ». Il mourut à 83 ans, ayant vu l'Angleterre ouvrir ses universités.",o:"Ce nombre est exclu. L'exclusion forge la matrice."},
{name:"Arthur Cayley",y:"1821-1895",t:"avocat matinal",b:"Avocat le matin, mathématicien l'après-midi pendant 14 ans. Il inventa les graphes et les espaces à n dimensions.",o:"Ce nombre est avocat le matin et géomètre l'après-midi. Les deux sont des arbres."},
{name:"Charles Hermite",y:"1822-1901",t:"détesteur de déterminants",b:"Échoua 5 fois à Polytechnique. Il prouva la transcendance de e. Il détestait les déterminants : « C'est de la sale besogne. »",o:"Ce nombre échoue cinq fois. La sixième fois, il transcende."},

{name:"David Hilbert",y:"1862-1943",t:"23 problèmes",b:"23 problèmes à Paris en 1900. « Nous devons savoir, nous saurons. » Il vit la destruction de Göttingen par les nazis. Il mourut seul.",o:"Ce nombre pose 23 questions. Les questions survivent aux réponses."},
{name:"Hermann Minkowski",y:"1864-1909",t:"espace-temps",b:"Professeur d'Einstein. Il unifia l'espace et le temps. Einstein ne comprit pas tout de suite. Minkowski mourut d'une appendicite à 44 ans.",o:"Ce nombre est un espace-temps. L'appendicite le raccourcit."},

{name:"Kurt Gödel",y:"1906-1978",t:"faim et paranoïa",b:"Il prouva l'incomplétude. Il refusa de manger de peur d'être empoisonné. Il mourut de faim à 65 ans, pesant 30 kg. Einstein l'accompagnait.",o:"Ce nombre meurt de faim. La faim est une forme de preuve."},

const FAM = {
  premier:{l:"Premier",c:"#C9A227"}, germain:{l:"Sophie Germain",c:"#27AE60"},
  mersenne:{l:"Mersenne",c:"#E74C3C"}, fermat:{l:"Fermat",c:"#9B59B6"},
  heegner:{l:"Heegner",c:"#1ABC9C"}, palindrome:{l:"Palindrome",c:"#FF69B4"},
  safe:{l:"Safe",c:"#5DADE2"}, jumeau:{l:"Jumeau",c:"#F1C40F"},
  taxicab:{l:"Taxicab",c:"#FF8C00"}, carre:{l:"Carré",c:"#00FFFF"},
  cube:{l:"Cube",c:"#FF00FF"}, fibonacci:{l:"Fibonacci",c:"#E67E22"},
  parfait:{l:"Parfait",c:"#E8E8E8"}, catalan:{l:"Catalan",c:"#8E44AD"},
  cullen:{l:"Cullen",c:"#2ECC71"}, woodall:{l:"Woodall",c:"#E91E63"},
  narcissique:{l:"Narcissique",c:"#FF5722"}, chanceux:{l:"Chanceux",c:"#00BCD4"},
  lucas:{l:"Lucas",c:"#FFC107"}, repunit:{l:"Repunit",c:"#795548"},
  composite:{l:"Composite",c:"#666666"}
};

const HEEG=[1,2,3,7,11,19,43,67,163], TAXI=[1729,4104,13832,20683,32832,39312];
const PARF=[6,28,496,8128,33550336,8589869056,137438691328,2305843008139952128];
const FERMAT=[3,5,17,257,65537];

function isPrime(n){if(n<2)return false;if(n%2===0)return n===2;for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;return true;}
function isPal(n){const s=String(n);return s===s.split('').reverse().join('');}
function isSq(n){const r=Math.floor(Math.sqrt(n));return r*r===n;}
function isCu(n){const r=Math.round(Math.pow(n,1/3));return r*r*r===n||(r+1)*(r+1)*(r+1)===n||(r-1)*(r-1)*(r-1)===n;}
function isFib(n){if(n<0)return false;const x=5*n*n;return isSq(x+4)||isSq(x-4);}
function isPow2(n){return n>0&&(n&(n-1))===0;}
function isMerForm(n){if(n<3)return false;return isPow2(n+1);}
function isRep(n){const s=String(n);return/^1+$/.test(s)&&s.length>1;}
function isNar(n){const s=String(n),k=s.length;let sum=0;for(const c of s)sum+=Math.pow(parseInt(c),k);return sum===n&&n>9;}
function isLuc(n){if(n===2||n===1)return true;let a=2,b=1;while(b<n){[a,b]=[b,a+b];}return b===n;}
function isCul(n){for(let k=1;k<30;k++){const c=k*Math.pow(2,k)+1;if(c===n)return true;if(c>n)break;}return false;}
function isWoo(n){for(let k=1;k<30;k++){const w=k*Math.pow(2,k)-1;if(w===n)return true;if(w>n)break;}return false;}

function detect(n){
  const tags=[], add=k=>tags.push({...FAM[k],k});
  if(isPal(n))add("palindrome");
  if(HEEG.includes(n))add("heegner");
  if(TAXI.includes(n))add("taxicab");
  if(PARF.includes(n))add("parfait");
  if(isSq(n))add("carre");
  if(isCu(n))add("cube");
  if(isFib(n))add("fibonacci");
  if(isLuc(n))add("lucas");
  if(isRep(n))add("repunit");
  if(isNar(n))add("narcissique");
  if(isCul(n))add("cullen");
  if(isWoo(n))add("woodall");
  const p=isPrime(n);
  if(p){
    add("premier");
    if(isPrime(2*n+1))add("germain");
    if(isPrime((n-1)/2))add("safe");
    if(isPrime(n+2)||isPrime(n-2))add("jumeau");
    if(isMerForm(n))add("mersenne");
    if(FERMAT.includes(n))add("fermat");
  } else if(n>1) add("composite");
  return tags;
}

function consult(){
  const err=document.getElementById('err');
  err.textContent='';
  try{
    const raw=document.getElementById('numInput').value.trim();
    if(!raw)return;
    const n=parseInt(raw,10);
    if(isNaN(n)||n<1){err.textContent="Entrez un entier positif.";return;}
    if(n>MAX){err.textContent="L'Oracle se fatigue au-delà de 7 733 377.";return;}
    const tags=detect(n);
    const soul=souls[Math.floor(Math.random()*souls.length)];
    const mainColor=tags.length>0?tags[0].c:"#00FF41";
    const big=document.getElementById('bigNum');
    big.textContent=n;big.style.color=mainColor;
    const tz=document.getElementById('tags');tz.innerHTML='';
    tags.forEach(t=>{
      const s=document.createElement('span');s.className='tag';
      s.style.color=t.c;s.style.borderColor=t.c;s.textContent=t.l;tz.appendChild(s);
    });
    document.getElementById('bioName').textContent=soul.name;
    document.getElementById('bioYears').textContent=soul.y+" — "+soul.t;
    document.getElementById('bioText').textContent=soul.b;
    document.getElementById('bioOracle').textContent="« "+soul.o+" »";
    document.getElementById('res').classList.add('show');
  }catch(e){
    err.textContent="Erreur : "+e.message;
    console.error(e);
  }
}

document.getElementById('btnOracle').addEventListener('click',consult);
document.getElementById('numInput').addEventListener('keypress',e=>{if(e.key==='Enter')consult();});

// --- PWA Install Button ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstall').style.display = 'inline-block';
});
document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('btnInstall').style.display = 'none';
});
</script>
